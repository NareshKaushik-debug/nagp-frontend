version: 0.2

env:
  variables:
    AWS_REGION: ap-south-1
    S3_BUCKET: replace-with-your-frontend-bucket
    CLOUDFRONT_DIST_ID: replace-with-your-cloudfront-id

phases:
  install:
    runtime-versions:
      nodejs: 18
  pre_build:
    commands:
      - cd Frontend
      - npm ci
  build:
    commands:
      - npm run build
  post_build:
    commands:
      - aws s3 sync dist s3://$S3_BUCKET --delete
      - aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DIST_ID --paths "/*"

artifacts:
  files:
    - '**/*'
  base-directory: Frontend/dist
